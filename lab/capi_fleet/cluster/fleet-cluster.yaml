apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: train-east
  namespace: fleet
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
      - 10.128.0.0/12
  topology:
    classRef:
      name: in-memory
      namespace: fleet
    controlPlane:
      replicas: 1
    version: v1.34.0
    workers:
      machineDeployments:
      - class: default-worker
        name: md-0

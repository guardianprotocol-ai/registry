name: scorecard

# OpenSSF Scorecard grades a repository's security practices: branch protection, pinned
# dependencies, token permissions, signed releases and more. The grade is published to the
# Security tab, so weakening a practice shows up rather than going unnoticed.
#
# This project is headed for the OpenSSF Sandbox, where the Scorecard is what reviewers
# read first. Running it on ourselves before anyone else does is the point.
on:
  # A scheduled run keeps the grade current as practices and the tool both change.
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]
  # Changing a branch rule changes the grade, so measure it again when one changes.
  branch_protection_rule:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Upload the result to the Security tab.
      security-events: write
      # Read the workflow runs Scorecard inspects.
      actions: read
      contents: read
      # Publish the result to the public OpenSSF API, so the badge and the public record
      # come from GitHub's own OIDC rather than from a token we hold.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the result so the badge in README.md resolves and anyone can check
          # the grade without taking our word for it.
          publish_results: true

      - name: Keep the raw result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Publish it to the Security tab
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          sarif_file: results.sarif

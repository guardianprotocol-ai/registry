name: checks

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. Anything that needs more asks for it explicitly.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor the project claims to support, the current release, and the version
        # the maintainers develop on.
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      # Actions are pinned to a commit, not a tag. A tag can be moved to point at new code
      # by whoever controls the action, so a tag is a promise and a commit is a fact.
      # Dependabot raises a pull request when a new version is released.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # If setup-python ever soft-fails, python3 would quietly be the runner's own
      # interpreter and every leg of the matrix would pass against the same version.
      - name: Confirm the matrix version is the one running
        run: |
          python3 -VV
          python3 -c "import sys; want='${{ matrix.python-version }}'; got='.'.join(map(str, sys.version_info[:2])); assert got == want, f'expected {want}, running {got}'"

      - name: Run every check
        run: python3 check.py

  # Runs once per pull request: proof for rule changes, and what the change does to detection.
  # CONTRIBUTING, README and GOVERNANCE all require a sign-off. Nothing checked it.
  signoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pull request and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Every commit is signed off
        run: python3 scripts/check_signoff.py "origin/${{ github.base_ref }}" HEAD

  # Contributors add patterns as draft. Promotion is a maintainer's decision, in its own
  # pull request. The author comes from the event, never from the files being checked.
  status-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pull request and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Only maintainers change a pattern's status
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_status_changes.py "origin/${{ github.base_ref }}" HEAD "$PR_AUTHOR"

  rule-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rule changes must come with evidence
        run: python3 scripts/require_rule_tests.py HEAD^1 HEAD

      # The base branch's engine runs against this change's corpus, then this change's engine
      # runs the same corpus. The difference is what the change does, posted to the run summary.
      - name: Compare detection before and after this change
        run: |
          git worktree add ../base HEAD^1
          python3 scripts/rule_gate.py --sensor-dir ../base/sensor --json > ../base.json || true
          python3 scripts/rule_gate.py --compare ../base.json --summary "$GITHUB_STEP_SUMMARY"

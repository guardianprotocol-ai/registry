# Keeps the pinned action commits current. Without this, pinning to a commit means
# never receiving the fix when one is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # One pull request for all action bumps, not one per action.
    groups:
      actions:
        patterns:
          - "*"
